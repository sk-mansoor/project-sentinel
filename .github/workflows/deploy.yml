name: Project Sentinel CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger
  schedule:
    - cron: '0 0 * * *' # Runs at midnight UTC every day

env:
  AWS_REGION: us-east-1
  LAMBDA_FUNCTION_NAME: sentinel-auto-remediator

jobs:
  prowler-scan:
    name: Continuous AWS Security Scan (Prowler)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install and Run Prowler
        continue-on-error: true
        run: |
          pip install prowler
          # Run Prowler specifically against S3 and IAM as a baseline check
          prowler aws -M csv json-asff html
      - name: Push Prowler Reports to Amazon S3
        run: |
          # Create a date folder prefix so reports are organized neatly
          DATE_PREFIX=$(date +'%Y-%m-%d')
          
          # Copy the generated HTML and CSV files from the prowler output directory to S3
          aws s3 cp output/ s3://sentinel-prowler-archive/$DATE_PREFIX/ --recursive --exclude "*" --include "*.html" --include "*.csv"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: 'us-east-1'

      - name: Sync Compliance to DynamoDB
        run: |
          pip install boto3
          python sync_compliance.py   

      - name: Upload Prowler Reports
        uses: actions/upload-artifact@v4
        if: always() # Upload reports even if Prowler finds vulnerabilities
        with:
          name: prowler-security-reports
          path: output/

  deploy-remediator:
    name: Deploy Auto-Remediator Engine
    runs-on: ubuntu-latest
    needs: prowler-scan # Waits for Prowler to finish before deploying
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package Lambda Function
        run: |
          # Automates the PowerShell ZIP command we were doing manually!
          zip remediator.zip remediator.py

      - name: Deploy to AWS Lambda
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --zip-file fileb://remediator.zip